<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>QR Scanner PRO</title>

<style>
body{
  font-family:Arial;
  margin:0;
  padding:20px;
  background:#0b1220;
  color:white;
}
.card{
  max-width:1000px;
  margin:auto;
  background:#111a2e;
  border:1px solid #22304f;
  border-radius:16px;
  padding:16px;
}
video{
  width:100%;
  height:420px;
  object-fit:cover;
  border-radius:12px;
  background:#000;
}
button,input,select{
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:10px;
  font-weight:bold;
}
input,select{
  width:100%;
  background:#0b1327;
  color:white;
  border:1px solid #22304f;
}
button{cursor:pointer}
.blue{background:#3b82f6;color:white}
.green{background:#22c55e;color:white}
.red{background:#ef4444;color:white}
.status{
  margin-top:10px;
  background:#0b1327;
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="card">

<h2>📷 QR Scanner PRO (NO LIBRARY)</h2>

<input id="dataField" placeholder="hasil scan muncul di sini">

<br>
<button class="blue" onclick="start()">Mulai Scan</button>
<button class="red" onclick="stop()">Stop</button>
<button class="green" onclick="save()">Masukan Data</button>

<select id="cameraSelect"></select>

<br>
<video id="video" playsinline muted></video>

<div class="status" id="status">Status: siap</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycby61q2gUCrVVuZcgajY3m9UPgxXNmGpdNT4Mr9wzkhlIXVzXEqPDZSsL1TJBq2RO2RM/exec";

const video=document.getElementById("video");
const statusEl=document.getElementById("status");
const dataField=document.getElementById("dataField");
const cameraSelect=document.getElementById("cameraSelect");

let stream;
let detector;
let running=false;

function setStatus(t){
  statusEl.innerText="Status: "+t;
}

async function loadCameras(){

  const devices=await navigator.mediaDevices.enumerateDevices();

  cameraSelect.innerHTML="";

  devices
  .filter(d=>d.kind==="videoinput")
  .forEach((d,i)=>{
    const opt=document.createElement("option");
    opt.value=d.deviceId;
    opt.text=d.label||("Camera "+(i+1));
    cameraSelect.appendChild(opt);
  });
}

async function start(){

  try{

    if(!('BarcodeDetector' in window)){
      setStatus("Browser tidak support BarcodeDetector");
      return;
    }

    detector=new BarcodeDetector({formats:['qr_code']});

    const deviceId=cameraSelect.value;

    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        deviceId: deviceId ? {exact:deviceId}:undefined
      },
      audio:false
    });

    video.srcObject=stream;
    await video.play();

    running=true;
    setStatus("kamera aktif...");

    scanLoop();

  }catch(e){
    setStatus("kamera gagal: "+e.message);
  }
}

async function scanLoop(){

  if(!running) return;

  try{
    const codes=await detector.detect(video);

    if(codes.length){
      const text=codes[0].rawValue;
      dataField.value=text;
      setStatus("QR terbaca ✅");
      stop();
      return;
    }
  }catch(e){}

  requestAnimationFrame(scanLoop);
}

function stop(){
  running=false;
  if(stream){
    stream.getTracks().forEach(t=>t.stop());
  }
  video.srcObject=null;
}

async function save(){

  const data=dataField.value.trim();

  if(!data){
    setStatus("data kosong");
    return;
  }

  setStatus("mengirim...");

  await fetch(API_URL,{
    method:"POST",
    mode:"no-cors",
    headers:{
      "Content-Type":"text/plain;charset=UTF-8"
    },
    body:JSON.stringify({data})
  });

  setStatus("terkirim ke sheet ✅");
  dataField.value="";
}

loadCameras();

</script>

</body>
</html>
