<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>QR Scanner PRO FINAL</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  margin:0;
  padding:20px;
  font-family:Arial;
  background:#0b1220;
  color:white;
}
.card{
  max-width:1000px;
  margin:auto;
  background:#111a2e;
  border:1px solid #22304f;
  border-radius:16px;
  padding:16px;
}
button,input{
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:10px;
  font-weight:bold;
}
input{
  width:100%;
  background:#0b1327;
  color:white;
  border:1px solid #22304f;
}
.blue{background:#3b82f6;color:white}
.red{background:#ef4444;color:white}
.green{background:#22c55e;color:white}
.status{
  margin-top:10px;
  background:#0b1327;
  padding:10px;
  border-radius:10px;
}
#reader{
  margin-top:10px;
  border-radius:12px;
  overflow:hidden;
}
</style>
</head>

<body>

<div class="card">

<h2>📷 QR Scanner PRO FINAL</h2>

<input id="dataField" placeholder="hasil scan muncul di sini">

<br>
<button class="blue" onclick="start()">Mulai Scan</button>
<button class="red" onclick="stop()">Stop</button>
<button class="green" onclick="save()">Masukan Data</button>

<div id="reader"></div>

<div class="status" id="status">Status: siap</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycby61q2gUCrVVuZcgajY3m9UPgxXNmGpdNT4Mr9wzkhlIXVzXEqPDZSsL1TJBq2RO2RM/exec";

let scanner;

function setStatus(t){
 document.getElementById("status").innerText="Status: "+t;
}

function start(){

  try{

    scanner=new Html5Qrcode("reader");

    scanner.start(
      { facingMode:"environment" },
      {
        fps:10,
        qrbox:250
      },
      qrCodeMessage => {

        document.getElementById("dataField").value=qrCodeMessage;

        setStatus("QR terbaca ✅");

        stop();

      },
      errorMessage => {}
    );

    setStatus("kamera aktif...");

  }catch(e){
    setStatus("kamera gagal: "+e.message);
  }
}

function stop(){
  if(scanner){
    scanner.stop().then(()=>{}).catch(()=>{});
  }
}

async function save(){

  const data=document.getElementById("dataField").value.trim();

  if(!data){
    setStatus("data kosong");
    return;
  }

  setStatus("mengirim...");

  await fetch(API_URL,{
    method:"POST",
    mode:"no-cors",
    headers:{
      "Content-Type":"text/plain;charset=UTF-8"
    },
    body:JSON.stringify({data})
  });

  setStatus("terkirim ke sheet ✅");
  document.getElementById("dataField").value="";
}

</script>

</body>
</html>
